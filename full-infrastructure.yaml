AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Full Infrastructure Stack
  Combines EC2, Security Group, and S3 in a single deployable template.

Parameters:
  EnvironmentType:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
    Description: Environment type

  KeyPairName:
    Type: String
    Description: Name of an existing EC2 KeyPair for SSH access
    Default: my-key-pair

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
    Description: EC2 instance type

  BucketName:
    Type: String
    Description: Unique name for the S3 bucket
    Default: my-cloudformation-bucket

  EnableVersioning:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable S3 bucket versioning

Mappings:
  RegionAMIMap:
    ap-south-1:
      AMI: ami-0f58b397bc5c1f2e8
    us-east-1:
      AMI: ami-0cff7528ff583bf9a

Conditions:
  IsVersioningEnabled: !Equals [!Ref EnableVersioning, "true"]
  IsProduction: !Equals [!Ref EnvironmentType, "production"]

Resources:

  # ─── Security Group ──────────────────────────────────────────
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentType}-ec2-security-group"
      GroupDescription: Allow SSH, HTTP and HTTPS access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentType}-security-group"
        - Key: Environment
          Value: !Ref EnvironmentType

  # ─── EC2 Instance ─────────────────────────────────────────────
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionAMIMap, !Ref AWS::Region, AMI]
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentType}-ec2-instance"
        - Key: Environment
          Value: !Ref EnvironmentType
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Deployed via CloudFormation | Environment: ${EnvironmentType}</h1>" > /var/www/html/index.html

  # ─── S3 Bucket ───────────────────────────────────────────────
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketName}-${EnvironmentType}"
      VersioningConfiguration:
        Status: !If [IsVersioningEnabled, Enabled, Suspended]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${BucketName}-${EnvironmentType}"
        - Key: Environment
          Value: !Ref EnvironmentType

  # ─── S3 Bucket Policy ────────────────────────────────────────
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::${S3Bucket}"
              - !Sub "arn:aws:s3:::${S3Bucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance

  EC2PublicIP:
    Description: Public IP of EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref EC2SecurityGroup

  S3BucketName:
    Description: S3 Bucket Name
    Value: !Ref S3Bucket

  S3BucketArn:
    Description: S3 Bucket ARN
    Value: !GetAtt S3Bucket.Arn
